<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <!-- CSS Bootstrap y FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="container mt-4">

    <h2>GESTIÓN PRODUCTOS</h2>
    <a href="/frmAgregarProducto" class="btn btn-primary mb-3">Agregar</a>

    <table class="table table-bordered">
        <thead class="bg-danger text-white text-center">
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Foto</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in listaProductos %}
            <tr>
                <td>{{ producto["código"] or producto["codigo"] }}</td>
                <td>{{ producto["nombre"] }}</td>
                <td>{{ producto["precio"] }}</td>
                <td>{{ producto["categoría"] or producto["categoria"] }}</td>
                <td class="text-center">
                    <img src="/static/imagenes/{{ producto['_id'] }}.jpg" width="50" height="50" style="object-fit: cover;">
                </td>
                <td class="text-center" style="font-size: 4vh;">
                    <a href="/consultar/{{ producto['_id'] }}">
                        <i class="fa fa-edit text-warning" title="Editar"></i>
                    </a>
                    <i onclick="abrirModalEliminar('{{ producto["_id"] }}')" class="fa fa-trash text-danger" title="Eliminar" style="cursor: pointer;"></i>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- SweetAlert2 para la confirmación de eliminación -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
